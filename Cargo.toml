[package]
name = "vynkor-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "vynm — plugin marketplace manager for vynkor: install, update, and manage kernel plugins from registries."
license = "MIT OR Apache-2.0"
repository = "https://github.com/vynkor-core/vynkor-manager"
readme = "README.md"
keywords = ["plugin", "marketplace", "cli", "package-manager"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "vynkor_manager"
path = "src/lib.rs"

[[bin]]
name = "vynm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: `vynm package` writes registry.json with the canonical
# meta → revoked → slugs-alphabetical key order package.sh established
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
# D8/TLS-bloat: no native-tls, no default features — rustls only
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2"
# keygen seed source (V-14a) — os rng only, no rng stack
getrandom = "0.2"
url = "2"
sha2 = "0.10"
semver = "1"
# shared plugin-manifest parsing/validation (single implementation, V-01);
# the no-kernel-crate rule is untouched — wire is a separate crate
vynkor-wire = { version = "0.0.2", features = ["manifest"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
indicatif = "0.18"
clap = { version = "4", features = ["derive"] }
# V-16 shell-completion generation (bash/zsh/fish) from the clap surface
clap_complete = "4"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"

mockito = "1"
