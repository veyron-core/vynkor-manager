[package]
name = "vynkor-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "vynm — plugin marketplace manager for Veyron/vynkor: install, update, and manage kernel plugins from registries."
license = "MIT"
repository = "https://github.com/veyron-core/vynkor-manager"

[lib]
name = "vynkor_manager"
path = "src/lib.rs"

[[bin]]
name = "vynm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# D8/TLS-bloat: no native-tls, no default features — rustls only
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2"
url = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
mockito = "1"
